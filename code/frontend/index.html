<!DOCTYPE html>

<body>
  <div class="ambient-grain" aria-hidden="true"></div>

    <a class="brand" href="#/discover" aria-label="EchoQuest 首页">

        <svg viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="5.2" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="20" cy="20" r="10.4" stroke="currentColor" stroke-width="1.1" opacity=".55"/>
          <circle cx="20" cy="20" r="15.2" stroke="currentColor" stroke-width=".9" opacity=".26"/>
          <path d="M20 9.8v4.1M20 26.1v4.1M9.8 20h4.1M26.1 20h4.1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>

      <a class="btn btn-primary btn-sm" href="#/create">
        <span class="icon" data-icon="pen"></span>

      <button class="avatar-button" type="button" data-action="open-profile" aria-label="打开创作者资料">
        <span>旅</span>

  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer" id="siteFooter">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="brand-mark small" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="5.2" stroke="currentColor" stroke-width="1.4"/>

            <circle cx="20" cy="20" r="15.2" stroke="currentColor" stroke-width=".9" opacity=".26"/>

        <div>

      <div class="footer-links">
        <a href="#/discover">故事广场</a>
        <a href="#/create">开始创作</a>
        <a href="#" data-action="open-about">关于原型</a>

    </div>

  <div id="overlayRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="js/data.js"></script>
