name: tests

# 说明：原仓库的 workflows/tests.yml 放在仓库根目录，GitHub 不会执行；
# 本文件是它的正确位置版本（.github/workflows/）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run regression tests
        run: python -m unittest discover -s qa/tests -v
